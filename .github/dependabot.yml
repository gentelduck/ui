version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
    ignore:
      # v2 refuses to run with @changesets/cli v2. Take it with the CLI v3 upgrade, then drop this.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
    groups:
      # init and analyze must run the same version, so every codeql-action step moves in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
